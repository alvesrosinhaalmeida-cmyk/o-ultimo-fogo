#menu{

    background:
        radial-gradient(
            circle at center,
            rgba(35,67,45,.55),

    display:flex;
    justify-content:center;

    text-align:center;
}

.panel{
    width:min(650px,88%);

button{

}

#controls{
    position:absolute;

.control{
    position:absolute;

    border-radius:12px;
    border:3px solid rgba(255,255,255,.4);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:auto;
}

.control:active{
    background:rgba(100,130,100,.65);
}

#left{
    left:18px;
    bottom:18px;
}

#right{
    left:88px;
    bottom:18px;
}

#jump{
    right:150px;
    bottom:18px;
}

#dash{
    right:82px;
    bottom:18px;
}

#attack{
    right:18px;
    bottom:84px;
}

#interact{
    right:18px;
    bottom:18px;
}

.hidden{
    display:none !important;
}

</style>
</head>

<body>

<div id="game">

<canvas id="canvas"
        width="960"
        height="540">
</canvas>

<div id="hud">

    <div id="healthBox">
        <div id="health"></div>
    </div>

    <div id="stageName">
        1-1 — A Floresta Perdida
    </div>

    <div id="coins">
        ✦ 0
    </div>

    <div id="bossHud">

        <div id="bossName">
            CURUPIRA
        </div>

        <div id="bossBar">
            <div id="bossHealth"></div>
        </div>

    </div>

    <div id="message"></div>

</div>

<div id="menu">

    <div class="panel">

        <div class="title">
            O ÚLTIMO FOGO
        </div>

        <div class="subtitle">

            A floresta guarda histórias
            que ninguém mais acredita.
            <br><br>

            Mas alguma coisa despertou.
            <br><br>

            Atravesse a mata,
            descubra seus segredos
            e encontre o fogo perdido.

        </div>

        <button id="startButton">
            COMEÇAR
        </button>

    </div>

</div>

<div id="controls">

    <div class="control" id="left">
        ◀
    </div>

    <div class="control" id="right">
        ▶
    </div>

    <div class="control" id="jump">
        ▲
    </div>

    <div class="control" id="dash">
        ◆
    </div>

    <div class="control" id="attack">
        ⚔
    </div>

    <div class="control" id="interact">
        ●
    </div>

</div>

</div>

<script>

"use strict";

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const WIDTH = 960;
const HEIGHT = 540;


/* =========================
   INTERFACE
========================= */

const menu =
    document.getElementById("menu");

const startButton =
    document.getElementById("startButton");

const healthBar =
    document.getElementById("health");

const coinsText =
    document.getElementById("coins");

const stageName =
    document.getElementById("stageName");

const messageBox =
    document.getElementById("message");

const bossHud =
    document.getElementById("bossHud");

const bossHealth =
    document.getElementById("bossHealth");


/* =========================
   ÁUDIO
========================= */

let audioContext = null;

function startAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}

function beep(
    frequency,
    duration,
    type="square",
    volume=.04
){

    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}

function soundAttack(){

    beep(170,.07,"sawtooth",.08);

    setTimeout(()=>{
        beep(90,.08,"square",.04);
    },30);
}

function soundJump(){

    beep(280,.08,"square",.05);

    setTimeout(()=>{
        beep(420,.07,"square",.03);
    },40);
}

function soundDash(){

    beep(100,.06,"sawtooth",.07);

    setTimeout(()=>{
        beep(190,.08,"square",.04);
    },30);
}

function soundHit(){

    beep(70,.12,"sawtooth",.08);
}

function soundCoin(){

    beep(700,.06,"square",.04);

    setTimeout(()=>{
        beep(1000,.08,"square",.03);
    },50);
}


/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=true;

        if([
            "arrowleft",
            "arrowright",
            "arrowup",
            " ",
            "z",
            "x",
            "c"
        ].includes(key)){

            event.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;
    }
);


function bindButton(
    id,
    key
){

    const button =
        document.getElementById(id);

    function press(event){

        event.preventDefault();

        keys[key]=true;
    }

    function release(event){

        event.preventDefault();

        keys[key]=false;
    }

    button.addEventListener(
        "pointerdown",
        press
    );

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}

bindButton(
    "left",
    "arrowleft"
);

bindButton(
    "right",
    "arrowright"
);

bindButton(
    "jump",
    "arrowup"
);

bindButton(
    "dash",
    "x"
);

bindButton(
    "attack",
    "z"
);

bindButton(
    "interact",
    "c"
);


/* =========================
   MUNDO
========================= */

const stages = [

    {
        name:"1-1 — A Floresta Perdida",
        width:3600
    },

    {
        name:"1-2 — Pegadas ao Contrário",
        width:4200
    },

    {
        name:"1-3 — O Território Proibido",
        width:4700
    },

    {
        name:"1-4 — O Coração da Mata",
        width:5200
    },

    {
        name:"1-5 — O Guardião da Mata",
        width:4200
    }

];

let currentStage = 0;

let worldWidth =
    stages[0].width;


/* =========================
   CÂMERA
========================= */

const camera = {

    x:0,
    shake:0

};


/* =========================
   PLAYER
========================= */

const player = {

    x:120,
    y:350,

    width:28,
    height:46,

    vx:0,
    vy:0,

    speed:3.3,
    jumpPower:11,

    facing:1,

    grounded:false,

    health:100,
    maxHealth:100,

    attacking:false,
    attackTimer:0,
    attackCooldown:0,

    dashTimer:0,
    dashCooldown:0,

    invincible:0,

    combo:0,
    comboTimer:0,

    coins:0,

    checkpointX:120,
    checkpointY:350,

    dead:false,

    /* habilidade do Curupira */

    forestSteps:false

};


/* =========================
   PLATAFORMAS
========================= */

let platforms=[];

function createPlatform(
    x,
    y,
    width,
    height=50
){

    platforms.push({
        x,
        y,
        width,
        height
    });

}


/* =========================
   INIMIGOS
========================= */

let enemies=[];

function createEnemy(
    type,
    x,
    y
){

    const data = {

        boar:{
            width:38,
            height:30,
            hp:35
        },

        owl:{
            width:36,
            height:27,
            hp:25
        },

        guardian:{
            width:38,
            height:36,
            hp:60
        },

        spirit:{
            width:34,
            height:38,
            hp:45
        }

    };

    const d =
        data[type];

    enemies.push({

        type,

        x,
        y,

        width:d.width,
        height:d.height,

        vx:0,
        vy:0,

        hp:d.hp,
        maxHp:d.hp,

        direction:
            Math.random()>.5
            ?1
            :-1,

        hitTimer:0,

        dead:false

    });

}


/* =========================
   COLETÁVEIS
========================= */

let collectibles=[];


/* =========================
   PARTÍCULAS
========================= */

let particles=[];

function createParticle(
    x,
    y,
    color,
    size,
    vx,
    vy,
    life=30
){

    particles.push({

        x,
        y,

        color,
        size,

        vx,
        vy,

        life,
        maxLife:life

    });

}


/* =========================
   BOSS
========================= */

let boss=null;

function createBoss(){

    boss={

        x:3650,
        y:330,

        width:90,
        height:120,

        hp:500,
        maxHp:500,

        phase:1,

        active:false,

        attackTimer:100,

        hitTimer:0,

        defeated:false

    };

}


/* =========================
   PROJÉTEIS
========================= */

let projectiles=[];


/* =========================
   CONSTRUIR FASE
========================= */

function buildStage(){

    platforms=[];
    enemies=[];
    collectibles=[];
    particles=[];
    projectiles=[];
    boss=null;

    worldWidth =
        stages[currentStage].width;

    stageName.textContent =
        stages[currentStage].name;


    /* CHÃO */

    for(
        let x=0;
        x<worldWidth;
        x+=180
    ){

        createPlatform(
            x,
            490,
            180,
            50
        );
    }


    /* PLATAFORMAS */

    const layouts=[

        [
            [300,410,180],
            [590,350,150],
            [850,430,210],
            [1160,350,180],
            [1450,290,170],
            [1740,400,220],
            [2100,320,180],
            [2380,390,220],
            [2700,300,180],
            [3020,380,200]
        ],

        [
            [250,390,170],
            [500,320,180],
            [820,390,180],
            [1100,290,170],
            [1400,370,220],
            [1780,300,160],
            [2100,400,200],
            [2500,330,220],
            [2900,270,180],
            [3300,370,220]
        ],

        [
            [300,360,160],
            [580,290,180],
            [900,390,170],
            [1250,300,220],
            [1600,400,180],
            [1950,320,180],
            [2250,250,180],
            [2600,380,230],
            [3100,290,220],
            [3500,350,180]
        ],

        [
            [250,400,180],
            [550,330,160],
            [820,250,180],
            [1150,360,220],
            [1500,280,180],
            [1850,380,220],
            [2200,300,170],
            [2550,220,180],
            [2900,350,220],
            [3350,280,200]
        ],

        [
            [300,400,200],
            [650,330,180],
            [1000,390,180],
            [1350,300,220],
            [1750,380,200],
            [2100,300,220],
            [2500,380,220],
            [2900,310,200],
            [3300,390,250]
        ]

    ];

    for(
        const p of layouts[currentStage]
    ){

        createPlatform(
            p[0],
            p[1],
            p[2]
        );

    }


    /* INIMIGOS */

    for(
        let x=450;
        x<worldWidth-400;
        x+=280
    ){

        const random =
            Math.random();

        if(random<.4){

            createEnemy(
                "boar",
                x,
                450
            );

        }
        else if(random<.62){

            createEnemy(
                "owl",
                x,
                250
            );

        }
        else if(random<.84){

            createEnemy(
                "guardian",
                x,
                450
            );

        }
        else{

            createEnemy(
                "spirit",
                x,
                420
            );
        }

    }


    /* COLETÁVEIS */

    for(
        let i=0;
        i<16;
        i++
    ){

        collectibles.push({

            x:
                220+
                i*240+
                Math.random()*70,

            y:
                250+
                Math.random()*150,

            collected:false

        });

    }


    /* BOSS */

    if(currentStage===4){

        createBoss();

    }


    player.x =
        player.checkpointX =
        120;

    player.y =
        player.checkpointY =
        350;

    player.vx=0;
    player.vy=0;

    player.health =
        player.maxHealth;

    updateHUD();

    bossHud.style.display =
        currentStage===4
        ?"block"
        :"none";

}


/* =========================
   COLISÃO
========================= */

function collision(a,b){

    return (

        a.x < b.x+b.width &&

        a.x+a.width > b.x &&

        a.y < b.y+b.height &&

        a.y+a.height > b.y

    );

}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

    if(player.dead)
        return;


    if(player.invincible>0)
        player.invincible--;

    if(player.attackCooldown>0)
        player.attackCooldown--;

    if(player.dashCooldown>0)
        player.dashCooldown--;


    /* COMBO */

    if(player.comboTimer>0){

        player.comboTimer--;

    }
    else{

        player.combo=0;

    }


    /* MOVIMENTO */

    let direction=0;

    if(
        keys["arrowleft"] ||
        keys["a"]
    ){

        direction=-1;

    }

    if(
        keys["arrowright"] ||
        keys["d"]
    ){

        direction=1;

    }


    if(direction!==0){

        player.vx +=
            direction*.65;

        if(
            Math.abs(player.vx)>
            player.speed
        ){

            player.vx =
                direction*
                player.speed;
        }

        player.facing =
            direction;

    }
    else{

        player.vx*=.78;

    }


    /* PULO */

    if(
        (
            keys["arrowup"] ||
            keys["w"] ||
            keys[" "]
        ) &&
        player.grounded
    ){

        player.vy =
            -player.jumpPower;

        player.grounded=false;

        soundJump();

        for(
            let i=0;
            i<7;
            i++
        ){

            createParticle(
                player.x+14,
                player.y+45,
                "#8da987",
                3,
                (Math.random()-.5)*2,
                -Math.random()*2
            );

        }

    }


    /* ATAQUE */

    if(
        (
            keys["z"] ||
            keys["j"]
        ) &&
        player.attackCooldown<=0
    ){

        player.attacking=true;

        player.attackTimer=10;

        player.attackCooldown=18;

        player.combo++;

        player.comboTimer=50;

        soundAttack();

    }


    if(player.attackTimer>0){

        player.attackTimer--;

    }
    else{

        player.attacking=false;

    }


    /* DASH */

    if(
        keys["x"] &&
        player.dashCooldown<=0
    ){

        player.dashCooldown=55;

        player.dashTimer=10;

        player.vx =
            player.facing*11;

        player.invincible=20;

        soundDash();

        for(
            let i=0;
            i<12;
            i++
        ){

            createParticle(
                player.x,
                player.y+22,
                "#8cb99a",
                3,
                -player.facing*
                Math.random()*3,
                (Math.random()-.5)*2,
                20
            );

        }

    }


    if(player.dashTimer>0){

        player.dashTimer--;

        player.vx =
            player.facing*11;

    }


    /* GRAVIDADE */

    player.vy+=.5;

    if(player.vy>14)
        player.vy=14;


    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;


    /* PLATAFORMAS */

    for(
        const platform of platforms
    ){

        if(

            player.x+player.width >
            platform.x &&

            player.x <
            platform.x+
            platform.width &&

            player.y+
            player.height >=
            platform.y &&

            player.y+
            player.height <=
            platform.y+
            player.vy+
            6 &&

            player.vy>=0

        ){

            player.y =
                platform.y-
                player.height;

            player.vy=0;

            player.grounded=true;

        }

    }


    /* LIMITES */

    if(player.x<0)
        player.x=0;

    if(
        player.x>
        worldWidth-
        player.width
    ){

        player.x=
            worldWidth-
            player.width;
    }


    /* QUEDA */

    if(player.y>650){

        damagePlayer(999);

    }


    /* ATAQUE */

    if(player.attacking){

        const hitbox={

            x:
                player.facing>0
                ?player.x+player.width
                :player.x-48,

            y:
                player.y+6,

            width:48,
            height:38

        };


        for(
            const enemy of enemies
        ){

            if(enemy.dead)
                continue;

            if(
                collision(
                    hitbox,
                    enemy
                )
            ){

                hitEnemy(enemy);

            }

        }


        if(
            boss &&
            boss.active &&
            !boss.defeated &&
            collision(
                hitbox,
                boss
            )
        ){

            hitBoss();

        }

    }

}


/* =========================
   ATINGIR INIMIGO
========================= */

function hitEnemy(enemy){

    const damage =
        12+
        player.combo*2;

    enemy.hp-=damage;

    enemy.hitTimer=8;

    enemy.vx =
        player.facing*4;

    camera.shake=5;


    for(
        let i=0;
        i<8;
        i++
    ){

        createParticle(
            enemy.x+
            enemy.width/2,

            enemy.y+
            enemy.height/2,

            "#e7c36b",

            3,

            (Math.random()-.5)*4,

            (Math.random()-.5)*4
        );

    }


    if(enemy.hp<=0){

        enemy.dead=true;

        player.coins++;

        soundCoin();

    }

}


/* =========================
   DANO
========================= */

function damagePlayer(amount){

    if(
        player.invincible>0 ||
        player.dead
    )
        return;


    player.health-=amount;

    player.invincible=55;

    soundHit();

    camera.shake=10;


    if(player.health<=0){

        player.health=0;

        player.dead=true;

        setTimeout(()=>{

            player.dead=false;

            player.x=
                player.checkpointX;

            player.y=
                player.checkpointY;

            player.vx=0;
            player.vy=0;

            player.health=
                player.maxHealth;

            player.invincible=60;

        },700);

    }

    updateHUD();

}


/* =========================
   HUD
========================= */

function updateHUD(){

    healthBar.style.width =
        Math.max(
            0,
            player.health/
            player.maxHealth*
            100

========================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        if(enemy.hitTimer>0)
            enemy.hitTimer--;


        if(enemy.type==="boar"){

            updateBoar(enemy);

        }
        else if(enemy.type==="owl"){

            updateOwl(enemy);

        }
        else if(enemy.type==="guardian"){

            updateGuardian(enemy);

        }
        else if(enemy.type==="spirit"){

            updateSpirit(enemy);

        }


        /* DANO AO PLAYER */

        if(
            collision(player,enemy) &&
            player.invincible<=0
        ){

            damagePlayer(
                enemy.type==="guardian"
                ?18
                :enemy.type==="spirit"
                ?15
                :12
            );

            player.vx =
                player.x<enemy.x
                ?-5
                :5;

            player.vy=-5;

        }

    }


    enemies =
        enemies.filter(
            enemy=>!enemy.dead
        );

}


/* =========================
   JAVALI
========================= */

function updateBoar(enemy){

    const distance =
        player.x-enemy.x;


    if(
        Math.abs(distance)<330
    ){

        enemy.direction =
            distance>0
            ?1
            :-1;

        enemy.vx =
            enemy.direction*1.8;

    }
    else{

        enemy.vx =
            enemy.direction*0.8;

    }


    enemy.x+=enemy.vx;


    if(enemy.x<0){

        enemy.x=0;
        enemy.direction=1;

    }


    if(
        enemy.x>
        worldWidth-
        enemy.width
    ){

        enemy.x=
            worldWidth-
            enemy.width;

        enemy.direction=-1;

    }


    enemy.y=450;

}

function updateOwl(enemy){

    const distance =
        player.x-enemy.x;


    if(

            distance*.012;

    }


    enemy.y +=
        Math.sin(
            performance.now()/250+

        collision(player,enemy) &&

/* =========================
   BOSS CURUPIRA
========================= */

function updateBoss(){

    if(
        !boss ||
        boss.defeated
    )
        return;


    /* ATIVA O BOSS */

    if(
        player.x>
        boss.x-700
    ){

        if(!boss.active){

            boss.active=true;

            showMessage(
                "CURUPIRA: Você não deveria estar aqui."
            );

        }

    }


    if(!boss.active)
        return;


    if(boss.hitTimer>0)
        boss.hitTimer--;


    /* FASE DO BOSS */

    const healthPercent =
        boss.hp/
        boss.maxHp;


    if(
        healthPercent>.66
    ){

        boss.phase=1;

    }
    else if(
        healthPercent>.33
    ){

        boss.phase=2;

    }
    else{

        boss.phase=3;

    }


    /* MOVIMENTO */

    const distance =
        player.x-boss.x;


    const speed =
        boss.phase===1
        ?0.8
        :boss.phase===2
        ?1.2
        :1.7;


    if(
        Math.abs(distance)>80
    ){

        boss.x +=
            Math.sign(distance)*
            speed;

    }


    boss.y=350;


    /* ATAQUE */

    boss.attackTimer--;


    if(
        boss.attackTimer<=0
    ){

        boss.attackTimer =
            boss.phase===1
            ?100
            :boss.phase===2
            ?72
            :50;


        bossAttack();

    }


    /* CONTATO */

    if(
        collision(player,boss) &&
        player.invincible<=0
    ){

        damagePlayer(
            boss.phase===1
            ?18
            :boss.phase===2
            ?24
            :30
        );

    }


    updateHUD();

}


/* =========================
   ATAQUE DO CURUPIRA
========================= */

function bossAttack(){

    const amount =
        boss.phase===1
        ?2
        :boss.phase===2
        ?4
        :6;


    for(
        let i=0;
        i<amount;
        i++
    ){

        setTimeout(()=>{

            if(
                !boss ||
                boss.defeated
            )
                return;


            const angle =
                Math.atan2(

                    player.y-
                    boss.y,

                    player.x-
                    boss.x

                )+
                (i-
                amount/2)*
                .16;


            const speed =
                boss.phase===3
                ?5.5
                :4;


            projectiles.push({

                x:
                    boss.x+
                    boss.width/2,

                y:
                    boss.y+45,

                vx:
                    Math.cos(angle)*
                    speed,

                vy:
                    Math.sin(angle)*
                    speed,

                size:
                    boss.phase===3
                    ?9
                    :7,

                life:160,

                dead:false

            });


        },i*100);

    }


    camera.shake=6;

}


/* =========================
   ATINGIR BOSS
========================= */

function hitBoss(){

    if(
        boss.hitTimer>0
    )
        return;


    const damage =
        8+
        player.combo*2;


    boss.hp-=damage;

    boss.hitTimer=12;

    camera.shake=8;


    soundHit();


    for(
        let i=0;
        i<15;
        i++
    ){

        createParticle(

            boss.x+
            boss.width/2,

            boss.y+
            boss.height/2,

            boss.phase===3
            ?"#df5548"
            :"#e2b657",

            4,

            (Math.random()-.5)*5,

            (Math.random()-.5)*5

        );

    }


    if(
        boss.hp<=0
    ){

        boss.hp=0;

        defeatBoss();

    }


    updateHUD();

}


/* =========================
   PROJÉTEIS
========================= */

function updateProjectiles(){

    for(
        const projectile
        of projectiles
    ){

        projectile.x +=
            projectile.vx;

        projectile.y +=
            projectile.vy;

        projectile.life--;


        if(
            projectile.life<=0
        ){

            projectile.dead=true;

            continue;

        }


        /* COLISÃO COM PLAYER */

        if(

            projectile.x<
            player.x+
            player.width &&

            projectile.x+
            projectile.size>
            player.x &&

            projectile.y<
            player.y+
            player.height &&

            projectile.y+
            projectile.size>
            player.y

        ){

            damagePlayer(
                boss &&
                boss.phase===3
                ?20
                :12
            );

            projectile.dead=true;

        }

    }


    projectiles =
        projectiles.filter(
            p=>!p.dead
        );

}

    if(

/* =========================
   FUNDO
========================= */

function drawBackground(){

    /* CÉU */

    ctx.fillStyle=
        "#07120d";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* LUA */

    ctx.fillStyle=
        "#d7cb91";

    ctx.fillRect(
        735,
        62,
        28,
        28
    );


    ctx.fillStyle=
        "#07120d";

    ctx.fillRect(
        748,
        57,
        25,
        25
    );


    /* MONTANHAS */

    ctx.fillStyle=
        "#0e2117";


    for(
        let i=0;
        i<12;
        i++
    ){

        const x =
            i*180-
            camera.x*.12;


        ctx.beginPath();

        ctx.moveTo(
            x,
            410
        );

        ctx.lineTo(
            x+90,
            180
        );

        ctx.lineTo(
            x+180,
            410
        );

        ctx.fill();

    }


    /* FLORESTA DISTANTE */

    for(
        let i=0;
        i<28;
        i++
    ){

        drawTree(

            i*115-
            camera.x*.25,

            300,

            1.1

        );

    }


    /* FLORESTA PRÓXIMA */

    for(
        let i=0;
        i<18;
        i++
    ){

        drawTree(

            i*175-
            camera.x*.55,

            370,

            1.45

        );

    }

}

function drawTree(
    x,
    y,
    scale
){

    ctx.fillStyle=
        "#111d16";

    ctx.fillRect(

        x-8*scale,

        y,

        16*scale,

        125*scale

    );


    ctx.fillStyle=
        "#142b1d";


    ctx.fillRect(

        x-45*scale,

        y-60*scale,

        90*scale,

        55*scale

    );


    ctx.fillRect(

        x-32*scale,

        y-90*scale,

        64*scale,

        50*scale

    );


    ctx.fillRect(

        x-20*scale,

        y-115*scale,

        40*scale,

        40*scale

    );

}

/* =========================
   BOSS VISUAL
========================= */

function drawBoss(){

    if(
        !boss ||
        boss.defeated
    )
        return;


    const x =
        Math.floor(
            boss.x-
            camera.x
        );

    const y =
        Math.floor(
            boss.y
        );


    /* AURA */

    ctx.fillStyle =
        boss.phase===1
        ?"rgba(60,130,70,.14)"
        :boss.phase===2
        ?"rgba(190,135,45,.17)"
        :"rgba(215,55,55,.20)";


    ctx.fillRect(
        x-25,
        y-25,
        boss.width+50,
        boss.height+50
    );


    /* CORPO */

    ctx.fillStyle =
        boss.phase===1
        ?"#315b3b"
        :boss.phase===2
        ?"#8d692e"
        :"#8e302f";


    ctx.fillRect(
        x+15,
        y+30,
        60,
        75
    );


    /* CABEÇA */

    ctx.fillStyle=
        "#a45e42";

    ctx.fillRect(
        x+20,
        y+10,
        50,
        45
    );


    /* CABELO */

    ctx.fillStyle=
        "#30251a";

    ctx.fillRect(
        x+12,
        y,
        66,
        17
    );

    ctx.fillRect(
        x+5,
        y+10,
        15,
        45
    );

    ctx.fillRect(
        x+70,
        y+10,
        15,
        45
    );


    /* OLHOS */

    ctx.fillStyle=
        "#e5d36a";

    ctx.fillRect(
        x+30,
        y+27,
        7,
        7
    );

    ctx.fillRect(
        x+53,
        y+27,
        7,
        7
    );


    /* PERNAS */

    ctx.fillStyle=
        "#253329";

    ctx.fillRect(
        x+20,
        y+100,
        18,
        20
    );

    ctx.fillRect(
        x+52,
        y+100,
        18,
        20
    );

}


/* =========================
   PROJÉTEIS VISUAIS
========================= */

function drawProjectiles(){

    for(
        const projectile
        of projectiles
    ){

        const x =
            projectile.x-
            camera.x;


        ctx.fillStyle=
            "#e6b74e";

        ctx.fillRect(

            x,

            projectile.y,

            projectile.size,

            projectile.size

        );


        ctx.fillStyle=
            "#fff0a0";

        ctx.fillRect(

            x+2,

            projectile.y+2,

            3,

            3

        );

    }

}


/* =========================
   PARTÍCULAS VISUAIS
========================= */

function drawParticles(){

    for(
        const particle
        of particles
    ){

        ctx.globalAlpha =
            particle.life/
            particle.maxLife;


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(

            Math.floor(
                particle.x-
                camera.x
            ),

            Math.floor(
                particle.y
            ),

            particle.size,

            particle.size

        );

    }


    ctx.globalAlpha=1;

========================= */

function updateForestSecrets(){

    if(!player.forestSteps)
        return;

    const secretPoints=[
        760,
        1540,
        2320,
        3150
    ];

    for(
        const point of secretPoints
    ){

        if(
            Math.abs(
                player.x-point
            )<35
        ){

            showMessage(
                "As pegadas do Curupira revelaram um caminho oculto."
            );

        }

    }

}


/* =========================
   SAÍDA DA FASE
========================= */

function checkStageExit(){

    if(currentStage<4){

        if(
            player.x>
            worldWidth-140
        ){

            nextStage();

        }

        return;
    }

    if(
        currentStage===4 &&
        boss &&
        boss.defeated &&
        player.x>
        worldWidth-140
    ){

        finishWorld();

    }

}


/* =========================
   PRÓXIMA FASE
========================= */

function nextStage(){

    currentStage++;

    if(currentStage>=5){

        currentStage=4;
        return;

    }

    showStageIntro();

}


/* =========================
   INTRO DA FASE
========================= */

function showStageIntro(){

    menu.innerHTML=`

        <div class="panel">

            <div class="title">
                ${stages[currentStage].name}
            </div>

            <div class="subtitle">

                A floresta fica mais profunda.

                <br><br>

                Novos caminhos surgem
                entre as árvores.

                <br><br>

                Os perigos também
                estão ficando maiores.

            </div>

            <button id="enterStage">
                ENTRAR NA FASE
            </button>

        </div>

    `;

    menu.classList.remove("hidden");

    document
        .getElementById("enterStage")
        .onclick=()=>{

            menu.classList.add("hidden");

            buildStage();

            showMessage(
                stages[currentStage].name
            );

        };

}


/* =========================
   COMEÇAR
========================= */

startButton.onclick=()=>{

    startAudio();

    menu.classList.add("hidden");

    currentStage=0;

    player.coins=0;
    player.forestSteps=false;
    player.dead=false;

    player.checkpointX=120;
    player.checkpointY=350;

    buildStage();

    showMessage(
        "Minha avó dizia que a floresta era viva..."
    );

};


/* =========================
   LOOP
========================= */

function update(){

    if(
        menu.classList.contains("hidden")
    ){

        updatePlayer();

        updateEnemies();

        updateCollectibles();

        updateCheckpoint();

        updateBoss();

        updateProjectiles();

        updateParticles();

        updateForestSecrets();

        updateCamera();

        checkStageExit();

        updateHUD();

    }

}


function draw(){

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.save();

    if(camera.shake>0){

        ctx.translate(
            (Math.random()-.5)*
            camera.shake,

            (Math.random()-.5)*
            camera.shake
        );

    }

    drawBackground();

    drawPlatforms();

    drawCollectibles();

    drawProjectiles();

    drawEnemies();

    drawBoss();

    drawForestSteps();

    drawPlayer();

    drawParticles();

    ctx.restore();

}


function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   INICIAR JOGO
========================= */

buildStage();

gameLoop();

</script>
