<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Último Fogo — Beta</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #050805;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#game-container {
    position: relative;
    width: min(100vw, 177.77vh);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #09130c;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
}

#dialog {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 6%;
    padding: 18px;
    background: rgba(5, 8, 6, 0.95);
    border: 2px solid #c9b86b;
    border-radius: 12px;
    color: white;
    display: none;
    cursor: pointer;
}

#speaker {
    color: #d9c774;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 18px;
}

#dialog-text {
    font-size: 16px;
    line-height: 1.4;
}

#dialog-help {
    margin-top: 8px;
    color: #aaa;
    font-size: 12px;
}

#touch-controls {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 15px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.touch-group {
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

.touch-button {
    width: 52px;
    height: 52px;
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 12px;
    background: rgba(10,15,10,.75);
    color: white;
    font-size: 21px;
    font-weight: bold;
    touch-action: none;
}

.touch-button:active {
    background: rgba(100,130,80,.8);
}
</style>
</head>

<body>

<div id="game-container">

<canvas id="game" width="960" height="540"></canvas>

<div id="dialog">
    <div id="speaker"></div>
    <div id="dialog-text"></div>
    <div id="dialog-help">Toque aqui ou pressione ENTER para continuar</div>
</div>

<div id="touch-controls">
    <div class="touch-group">
        <button class="touch-button" data-key="left">◀</button>
        <button class="touch-button" data-key="right">▶</button>
    </div>

    <div class="touch-group">
        <button class="touch-button" data-key="jump">↑</button>
        <button class="touch-button" data-key="attack">⚔</button>
    </div>
</div>

</div>
