<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,

<title>O Último Fogo</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050907;
    font-family:monospace;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    background:#07120d;
    image-rendering:pixelated;
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    align-items:center;
    gap:14px;
    pointer-events:none;
    z-index:10;
}

#healthBox{
    width:190px;
    height:20px;

}

#health{

    height:100%;

}

#coins{
    color:#e5c65f;
    font-size:18px;

}

#stageName{

    color:#ddd5b5;

    text-shadow:2px 2px #000;
}


/* =========================
   BOSS HUD
========================= */

#bossHud{
    position:absolute;
    left:50%;
    top:58px;
    transform:translateX(-50%);

    display:none;
    z-index:10;
    pointer-events:none;
}

#bossTitle{
    color:#e3c467;
    text-align:center;
    font-size:15px;
    margin-bottom:5px;
    text-shadow:2px 2px #000;
}

#bossBar{
    width:100%;
    height:17px;
    border:3px solid #d8b85a;
    background:#111;
}

#bossHealth{
    width:100%;
    height:100%;
    background:#8d3c38;
}


/* =========================
   MENU
========================= */

#menu{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    transition:opacity .2s;
}

#menu.hidden{
    display:none;
}

.panel{
    width:min(850px,90vw);
    max-height:90vh;
    overflow:auto;
    padding:40px 30px;
    text-align:center;
    border:5px solid #d6b75c;
    background:#07120d;
    box-shadow:
        0 0 0 8px rgba(214,183,92,.08),
        0 0 50px rgba(0,0,0,.8);
}

.title{
    color:#e0bd59;
    font-size:42px;
    letter-spacing:8px;
    margin-bottom:28px;
}

.subtitle{
    color:#bfc6bd;
    font-size:17px;
    line-height:1.9;
    margin-bottom:30px;
}

button{
    border:3px solid #d9bb5e;
    background:#0b1b12;
    color:#f0ead0;
    padding:16px 35px;
    font-family:monospace;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

button:hover{
    background:#183522;
}

button:active{
    transform:scale(.96);
}


/* =========================
   MENSAGEM
========================= */

#message{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    width:min(700px,90vw);
    padding:12px 18px;
    text-align:center;
    color:#eee6ca;
    background:rgba(4,10,7,.88);
    border:2px solid #8c7942;
    font-size:15px;
    display:none;
    z-index:20;
    pointer-events:none;
}


/* =========================
   CONTROLES
========================= */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    z-index:20;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:10px;
    pointer-events:auto;
}

.control{
    width:62px;
    height:62px;
    border:2px solid rgba(220,195,110,.7);
    border-radius:12px;
    background:rgba(10,25,16,.75);
    color:#ddd2a7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    user-select:none;
    touch-action:none;
}

.control:active{
    background:rgba(80,100,55,.8);
    transform:scale(.94);
}

.small{
    width:54px;
    height:54px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #hud{
        top:8px;
        left:8px;
        right:8px;
        gap:7px;
    }

    #healthBox{
        width:125px;
        height:15px;
    }

    #coins{
        font-size:13px;
    }

    #stageName{
        font-size:11px;
    }

    #bossHud{
        top:38px;
        width:240px;
    }

    .title{
        font-size:25px;
        letter-spacing:4px;
    }

    .subtitle{
        font-size:13px;
    }

    .panel{
        padding:25px 18px;
        border-width:3px;
    }

    button{
        font-size:15px;
        padding:13px 25px;
    }

    #controls{
        bottom:8px;
        padding:0 10px;
    }

    .control{
        width:52px;
        height:52px;
        font-size:18px;
    }

    .small{
        width:46px;
        height:46px;
    }

    #message{
        bottom:78px;
        font-size:12px;
    }

}

</style>
</head>


<body>

<div id="game">

    <canvas
        id="canvas"
        width="960"
        height="540">
    </canvas>


    <!-- HUD -->

    <div id="hud">

        <div id="healthBox">
            <div id="health"></div>
        </div>

        <div id="coins">
            ✦ 0
        </div>

        <div id="stageName">
            1-1 — A Floresta Perdida
        </div>

    </div>


    <!-- BOSS -->

    <div id="bossHud">

        <div id="bossTitle">
            CURUPIRA
        </div>

        <div id="bossBar">
            <div id="bossHealth"></div>
        </div>

    </div>


    <!-- MENSAGEM -->

    <div id="message"></div>


    <!-- MENU -->

    <div id="menu">

        <div class="panel">

            <div class="title">
                O ÚLTIMO FOGO
            </div>

            <div class="subtitle">

                A floresta guarda histórias
                que ninguém mais acredita.

                <br><br>

                Mas alguma coisa despertou.

                <br><br>

                Atravesse a mata,
                descubra seus segredos
                e encontre o fogo perdido.

            </div>

            <button
                id="startButton"
                type="button"
                onclick="startGame()">

                COMEÇAR

            </button>

        </div>

    </div>

    <div id="controls">

        <div class="controlGroup">

            <div
                class="control"
                id="left">

                id="right">
                ▶
            </div>

        </div>


        <div class="controlGroup">

            <div
                class="control small"
                id="interact">
                C
            </div>

            <div
                class="control small"
                id="dash">
                X
            </div>

            <div
                class="control"
                id="jump">
                ▲
            </div>

            <div
                class="control"
                id="attack">
                ⚔
            </div>

        </div>

    </div>

</div>


<script>

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const WIDTH=960;
const HEIGHT=540;


/* =====================================================
   ELEMENTOS
===================================================== */

const menu =
    document.getElementById("menu");

const startButton =
    document.getElementById("startButton");

const healthBar =
    document.getElementById("health");

const coinsText =
    document.getElementById("coins");

const stageName =
    document.getElementById("stageName");

const messageBox =
    document.getElementById("message");

const bossHud =
    document.getElementById("bossHud");

const bossHealth =
    document.getElementById("bossHealth");


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext=null;

function startAudio(){

    try{

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass){
            return;
        }

        if(!audioContext){
            audioContext =
                new AudioClass();
        }

        if(
            audioContext.state===
            "suspended"
        ){

            audioContext
                .resume()
                .catch(()=>{});

        }

    }catch(error){

        console.log(
            "Áudio indisponível."
        );

    }

}


function beep(
    frequency,
    duration,
    type="square",
    volume=.04
){

    if(!audioContext){
        return;
    }

    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type=type;

        oscillator.frequency.value=
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+
            duration
        );

    }catch(error){}

}


function soundAttack(){
    beep(180,.06,"sawtooth",.07);
}

function soundJump(){
    beep(320,.08,"square",.05);
}

function soundDash(){
    beep(100,.08,"sawtooth",.07);
}

function soundHit(){
    beep(70,.12,"sawtooth",.07);
}

function soundCoin(){
    beep(700,.05,"square",.04);

    setTimeout(()=>{
        beep(1000,.07,"square",.03);
    },40);
}


/* =====================================================
   TECLADO
===================================================== */

const keys={};


window.addEventListener(
    "keydown",
    function(event){

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            [
                "arrowleft",
                "arrowright",
                "arrowup",
                " ",
                "z",
                "x",
                "c"
            ].includes(key)
        ){

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);


/* =====================================================
   CONTROLES TOUCH
===================================================== */

function bindButton(
    id,
    key
){

    const button =
        document.getElementById(id);

    if(!button){
        return;
    }


    button.addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(event){

            event.preventDefault();

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[key]=false;

        }
    );

}


bindButton("left","arrowleft");
bindButton("right","arrowright");
bindButton("jump","arrowup");
bindButton("attack","z");
bindButton("dash","x");
bindButton("interact","c");


/* =====================================================
   FASES
===================================================== */

const stages=[

    {
        name:"1-1 — A Floresta Perdida",
        width:3600
    },

    {
        name:"1-2 — Pegadas ao Contrário",
        width:4200
    },

    {
        name:"1-3 — O Território Proibido",
        width:4700
    },

    {
        name:"1-4 — O Coração da Mata",
        width:5200
    },

    {
        name:"1-5 — O Guardião da Mata",
        width:4200
    }

];


let currentStage=0;

let worldWidth=
    stages[0].width;


/* =====================================================
   CÂMERA
===================================================== */

const camera={
    x:0,
    shake:0
};


/* =====================================================
   PLAYER
===================================================== */

const player={

    x:120,
    y:350,

    width:28,
    height:46,

    vx:0,
    vy:0,

    speed:3.4,
    jumpPower:11,

    facing:1,

    grounded:false,

    health:100,
    maxHealth:100,

    attacking:false,
    attackTimer:0,
    attackCooldown:0,

    dashTimer:0,
    dashCooldown:0,

    invincible:0,

    combo:0,
    comboTimer:0,

    coins:0,

    checkpointX:120,
    checkpointY:350,

    dead:false,

    forestSteps:false

};


/* =====================================================
   ARRAYS
===================================================== */

let platforms=[];
let enemies=[];
let collectibles=[];
let particles=[];
let projectiles=[];

let boss=null;


/* =====================================================
   PLATAFORMAS
===================================================== */

function createPlatform(
    x,
    y,
    width,
    height=50
){

    platforms.push({
        x:x,
        y:y,
        width:width,
        height:height
    });

}


/* =====================================================
   INIMIGOS
===================================================== */

function createEnemy(
    type,
    x,
    y
){

    const data={

        boar:{
            width:38,
            height:35,
            hp:35
        },

        owl:{
            width:36,
            height:27,
            hp:25
        },

        guardian:{
            width:38,
            height:37,
            hp:60
        },

        spirit:{
            width:34,
            height:38,
            hp:45
        }

    };


    const d=data[type];


    enemies.push({

        type:type,

        x:x,
        y:y,

        width:d.width,
        height:d.height,

        vx:0,
        vy:0,

        hp:d.hp,
        maxHp:d.hp,

        direction:
            Math.random()>.5
            ?1
            :-1,

        hitTimer:0,

        dead:false

    });

}


/* =====================================================
   BOSS
===================================================== */

function createBoss(){

    boss={

        x:3650,
        y:350,

        width:90,
        height:120,

        hp:500,
        maxHp:500,

        phase:1,

        active:false,

        attackTimer:100,

        hitTimer:0,

        defeated:false

    };

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function createParticle(
    x,
    y,
    color,
    size,
    vx,
    vy,
    life=30
){

    particles.push({

        x:x,
        y:y,

        color:color,
        size:size,

        vx:vx,
        vy:vy,

        life:life,
        maxLife:life

    });

}


/* =====================================================
   CONSTRUIR FASE
===================================================== */

function buildStage(){

    platforms=[];
    enemies=[];
    collectibles=[];
    particles=[];
    projectiles=[];

    boss=null;

    worldWidth=
        stages[currentStage].width;

    stageName.textContent=
        stages[currentStage].name;


    /* CHÃO */

    for(
        let x=0;
        x<worldWidth;
        x+=180
    ){

        createPlatform(
            x,
            490,
            180,
            50
        );

    }


    /* PLATAFORMAS */

    const layouts=[

        [
            [300,410,180],
            [590,350,150],
            [850,430,210],
            [1160,350,180],
            [1450,290,170],
            [1740,400,220],
            [2100,320,180],
            [2380,390,220],
            [2700,300,180],
            [3020,380,200]
        ],

        [
            [250,390,170],
            [500,320,180],
            [820,390,180],
            [1100,290,170],
            [1400,370,220],
            [1780,300,160],
            [2100,400,200],
            [2500,330,220],
            [2900,270,180],
            [3300,370,220]
        ],

        [
            [300,360,160],
            [580,290,180],
            [900,390,170],
            [1250,300,220],
            [1600,400,180],
            [1950,320,180],
            [2250,250,180],
            [2600,380,230],
            [3100,290,220],
            [3500,350,180]
        ],

        [
            [250,400,180],
            [550,330,160],
            [820,250,180],
            [1150,360,220],
            [1500,280,180],
            [1850,380,220],
            [2200,300,170],
            [2550,220,180],
            [2900,350,220],
            [3350,280,200]
        ],

        [
            [300,400,200],
            [650,330,180],
            [1000,390,180],
            [1350,300,220],
            [1750,380,200],
            [2100,300,220],
            [2500,380,220],
            [2900,310,200],
            [3300,390,250]
        ]

    ];


    for(
        const p of layouts[currentStage]
    ){

        createPlatform(
            p[0],
            p[1],
            p[2]
        );

    }


    /* INIMIGOS */

    for(
        let x=450;
        x<worldWidth-400;
        x+=280
    ){

        const r=Math.random();

        if(r<.4){

            createEnemy(
                "boar",
                x,
                450
            );

        }
        else if(r<.62){

            createEnemy(
                "owl",
                x,
                250
            );

        }
        else if(r<.84){

            createEnemy(
                "guardian",
                x,
                450
            );

        }
        else{

            createEnemy(
                "spirit",
                x,
                420
            );

        }

    }


    /* COLETÁVEIS */

    for(
        let i=0;
        i<16;
        i++
    ){

        collectibles.push({

            x:
                220+
                i*240+
                Math.random()*70,

            y:
                250+
                Math.random()*150,

            collected:false

        });

    }


    /* BOSS */

    if(currentStage===4){

        createBoss();

    }


    /* PLAYER */

    player.x=120;
    player.y=350;

    player.vx=0;
    player.vy=0;

    player.health=
        player.maxHealth;

    player.checkpointX=120;
    player.checkpointY=350;


    camera.x=0;

    bossHud.style.display=
        currentStage===4
        ?"block"
        :"none";

    updateHUD();

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x <
        b.x+b.width &&

        a.x+a.width >
        b.x &&

        a.y <
        b.y+b.height &&

        a.y+a.height >
        b.y

    );

}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer(){

    if(player.dead){
        return;
    }


    if(player.invincible>0)
        player.invincible--;

    if(player.attackCooldown>0)
        player.attackCooldown--;

    if(player.dashCooldown>0)
        player.dashCooldown--;


    if(player.comboTimer>0){

        player.comboTimer--;

    }
    else{

        player.combo=0;

    }


    let direction=0;


    if(
        keys["arrowleft"] ||
        keys["a"]
    ){

        direction=-1;

    }


    if(
        keys["arrowright"] ||
        keys["d"]
    ){

        direction=1;

    }


    if(direction!==0){

        player.vx+=
            direction*.65;

        if(
            Math.abs(player.vx)>
            player.speed
        ){

            player.vx=
                direction*
                player.speed;

        }

        player.facing=
            direction;

    }
    else{

        player.vx*=.78;

    }


    /* PULO */

    if(
        (
            keys["arrowup"] ||
            keys["w"] ||
            keys[" "]
        ) &&
        player.grounded
    ){

        player.vy=
            -player.jumpPower;

        player.grounded=false;

        soundJump();

    }


    /* ATAQUE */

    if(
        keys["z"] &&
        player.attackCooldown<=0
    ){

        player.attacking=true;

        player.attackTimer=10;

        player.attackCooldown=18;

        player.combo++;

        player.comboTimer=50;

        soundAttack();

    }


    if(player.attackTimer>0){

        player.attackTimer--;

    }
    else{

        player.attacking=false;

    }


    /* DASH */

    if(
        keys["x"] &&
        player.dashCooldown<=0
    ){

        player.dashCooldown=55;

        player.dashTimer=10;

        player.vx=
            player.facing*11;

        player.invincible=20;

        soundDash();

    }


    if(player.dashTimer>0){

        player.dashTimer--;

        player.vx=
            player.facing*11;

    }


    /* GRAVIDADE */

    player.vy+=.5;

    if(player.vy>14)
        player.vy=14;


    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;


    /* PLATAFORMAS */

    for(
        const platform of platforms
    ){

        if(

            player.x+player.width>
            platform.x &&

            player.x<
            platform.x+
            platform.width &&

            player.y+
            player.height>=
            platform.y &&

            player.y+
            player.height<=
            platform.y+
            platform.height+
            8 &&

            player.vy>=0

        ){

            player.y=
                platform.y-
                player.height;

            player.vy=0;

            player.grounded=true;

        }

    }


    /* LIMITES */

    if(player.x<0)
        player.x=0;


    if(
        player.x>
        worldWidth-player.width
    ){

        player.x=
            worldWidth-player.width;

    }


    if(player.y>650){

        damagePlayer(999);

    }


    /* ATAQUE */

    if(player.attacking){

        const hitbox={

            x:
                player.facing>0
                ?player.x+player.width
                :player.x-48,

            y:player.y+6,

            width:48,
            height:38

        };


        for(
            const enemy of enemies
        ){

            if(
                !enemy.dead &&
                collision(
                    hitbox,
                    enemy
                )
            ){

                hitEnemy(enemy);

            }

        }


        if(
            boss &&
            boss.active &&
            !boss.defeated &&
            collision(
                hitbox,
                boss
            )
        ){

            hitBoss();

        }

    }

}


/* =====================================================
   INIMIGOS
===================================================== */

function updateEnemies(){

    for(
        const enemy of enemies
    ){

        if(enemy.dead)
            continue;


        if(enemy.hitTimer>0)
            enemy.hitTimer--;


        if(enemy.type==="boar")
            updateBoar(enemy);

        if(enemy.type==="owl")
            updateOwl(enemy);

        if(enemy.type==="guardian")
            updateGuardian(enemy);

        if(enemy.type==="spirit")
            updateSpirit(enemy);


        if(
            collision(player,enemy) &&
            player.invincible<=0
        ){

            damagePlayer(
                enemy.type==="guardian"
                ?18
                :enemy.type==="spirit"
                ?15
                :12
            );

            player.vx=
                player.x<enemy.x
                ?-5
                :5;

            player.vy=-5;

        }

    }


    enemies=
        enemies.filter(
            enemy=>!enemy.dead
        );

}


function updateBoar(enemy){

    const distance=
        player.x-enemy.x;


    if(
        Math.abs(distance)<330
    ){

        enemy.direction=
            distance>0?1:-1;

        enemy.vx=
            enemy.direction*1.8;

    }
    else{

        enemy.vx=
            enemy.direction*.8;

    }


    enemy.x+=enemy.vx;

    enemy.y=450;


    if(enemy.x<0){

        enemy.x=0;
        enemy.direction=1;

    }


    if(
        enemy.x>
        worldWidth-enemy.width
    ){

        enemy.x=
            worldWidth-enemy.width;

        enemy.direction=-1;

    }

}


function updateOwl(enemy){

    const distance=
        player.x-enemy.x;


    if(
        Math.abs(distance)<500
    ){

        enemy.x+=
            distance*.012;

    }


    enemy.y=
        250+
        Math.sin(
            performance.now()/250+
            enemy.x
        )*25;

}


function updateGuardian(enemy){

    const distance=
        player.x-enemy.x;


    if(
        Math.abs(distance)<360
    ){

        enemy.direction=
            distance>0?1:-1;

        enemy.vx=
            enemy.direction*1.1;

    }
    else{

        enemy.vx=
            enemy.direction*.55;

    }


    enemy.x+=enemy.vx;

    enemy.y=450;


    if(enemy.x<0){

        enemy.x=0;
        enemy.direction=1;

    }


    if(
        enemy.x>
        worldWidth-enemy.width
    ){

        enemy.x=
            worldWidth-enemy.width;

        enemy.direction=-1;

    }

}


function updateSpirit(enemy){

    const distance=
        player.x-enemy.x;


    if(
        Math.abs(distance)<500
    ){

        enemy.x+=
            distance*.006;

    }


    enemy.y=
        420+
        Math.sin(
            performance.now()/280+
            enemy.x
        )*30;

}

/* =====================================================
   DANO
===================================================== */

function damagePlayer(amount){

    if(
        player.invincible>0 ||
        player.dead
    ){

        return;

    }


    player.health-=amount;

    player.invincible=55;

    camera.shake=10;

    soundHit();


    if(player.health<=0){

        player.health=0;

        player.dead=true;

        setTimeout(()=>{

            player.dead=false;

            player.x=
                player.checkpointX;

            player.y=
                player.checkpointY;

            player.vx=0;
            player.vy=0;

            player.health=
                player.maxHealth;

            player.invincible=60;

            updateHUD();

        },700);

    }


    updateHUD();

}

/* =====================================================
   BOSS
===================================================== */

function updateBoss(){

    if(
        !boss ||
        boss.defeated
    ){

        return;

    }


    if(
        player.x>
        boss.x-700
    ){

        if(!boss.active){

            boss.active=true;

            showMessage(
                "CURUPIRA: Você não deveria estar aqui."
            );

        }

    }


    if(!boss.active)
        return;


    if(boss.hitTimer>0)
        boss.hitTimer--;


    const percent=
        boss.hp/boss.maxHp;


    if(percent>.66)
        boss.phase=1;
    else if(percent>.33)
        boss.phase=2;
    else
        boss.phase=3;


    const distance=
        player.x-boss.x;


    const speed=
        boss.phase===1
        ?.8
        :boss.phase===2
        ?1.2
        :1.7;


    if(
        Math.abs(distance)>80
    ){

        boss.x+=
            Math.sign(distance)*
            speed;

    }


    boss.y=350;

    boss.attackTimer--;


    if(
        boss.attackTimer<=0
    ){

        boss.attackTimer=
            boss.phase===1
            ?100
            :boss.phase===2
            ?72
            :50;

        bossAttack();

    }


    if(
        collision(player,boss) &&
        player.invincible<=0
    ){

        damagePlayer(
            boss.phase===1
            ?18
            :boss.phase===2
            ?24
            :30
        );

    }


    updateHUD();

}


/* =====================================================
   ATAQUE DO BOSS
===================================================== */

function bossAttack(){

    const amount=
        boss.phase===1
        ?2
        :boss.phase===2
        ?4
        :6;


    for(
        let i=0;
        i<amount;
        i++
    ){

        setTimeout(()=>{

            if(
                !boss ||
                boss.defeated
            ){

                return;

            }


            const angle=
                Math.atan2(
                    player.y-boss.y,
                    player.x-boss.x
                )+
                (i-amount/2)*.16;


            const speed=
                boss.phase===3
                ?5.5
                :4;


            projectiles.push({

                x:
                    boss.x+
                    boss.width/2,

                y:
                    boss.y+45,

                vx:
                    Math.cos(angle)*
                    speed,

                vy:
                    Math.sin(angle)*
                    speed,

                size:
                    boss.phase===3
                    ?9
                    :7,

                life:160,

                dead:false

            });

        },i*100);

    }

}


/* =====================================================
   ATACAR BOSS
===================================================== */

function hitBoss(){

    if(
        !boss ||
        boss.hitTimer>0
    ){

        return;

    }


    const damage=
        8+
        player.combo*2;


    boss.hp-=damage;

    boss.hitTimer=12;

    camera.shake=8;

    soundHit();


    for(let i=0;i<15;i++){

        createParticle(

            boss.x+
            boss.width/2,

            boss.y+
            boss.height/2,

            "#e2b657",

            4,

            (Math.random()-.5)*5,

            (Math.random()-.5)*5

        );

    }


    if(boss.hp<=0){

        boss.hp=0;

        defeatBoss();

    }


    updateHUD();

}


function defeatBoss(){

    if(boss.defeated)
        return;


    boss.defeated=true;

    projectiles=[];

    player.coins+=50;

    showMessage(
        "CURUPIRA DERROTADO!"
    );


    setTimeout(
        showBossVictory,
        1200
    );

}


/* =====================================================
   PROJÉTEIS
===================================================== */

function updateProjectiles(){

    for(
        const p of projectiles
    ){

        p.x+=p.vx;
        p.y+=p.vy;

        p.life--;


        if(p.life<=0){

            p.dead=true;
            continue;

        }


        if(
            p.x<
            player.x+
            player.width &&

            p.x+p.size>
            player.x &&

            p.y<
            player.y+
            player.height &&

            p.y+p.size>
            player.y

        ){

            damagePlayer(
                boss &&
                boss.phase===3
                ?20
                :12
            );

            p.dead=true;

        }

    }


    projectiles=
        projectiles.filter(
            p=>!p.dead
        );

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function updateParticles(){

    for(
        const p of particles
    ){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.05;

        p.life--;

    }


    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){

    const target=
        player.x-
        WIDTH*.38;


    camera.x+=
        (target-camera.x)*.09;


    if(camera.x<0)
        camera.x=0;


    if(
        camera.x>
        worldWidth-WIDTH
    ){

        camera.x=
            worldWidth-WIDTH;

    }


    if(camera.shake>0){

        camera.shake*=.8;

        if(camera.shake<.2)
            camera.shake=0;

    }

}

/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

    ctx.fillStyle="#07120d";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* LUA */

    ctx.fillStyle="#d8ce9a";

    ctx.fillRect(
        735,
        60,
        30,
        30
    );


    ctx.fillStyle="#07120d";

    ctx.fillRect(
        750,
        55,
        27,
        25
    );


    /* MONTANHAS */

    ctx.fillStyle="#0c1d14";


    for(
        let i=0;
        i<12;
        i++
    ){

        const x=
            i*180-
            camera.x*.12;


        ctx.beginPath();

        ctx.moveTo(
            x,
            420
        );

        ctx.lineTo(
            x+90,
            190
        );

        ctx.lineTo(
            x+180,
            420
        );

        ctx.fill();

    }


    /* ÁRVORES */

    for(
        let i=0;
        i<30;
        i++
    ){

        drawTree(
            i*115-
            camera.x*.25,
            310,
            1.1
        );

    }


    for(
        let i=0;
        i<20;
        i++
    ){

        drawTree(
            i*175-
            camera.x*.55,
            370,
            1.45
        );

    }

}


/* =====================================================
   ÁRVORE
===================================================== */

function drawTree(
    x,
    y,
    scale
){

    ctx.fillStyle="#111d16";

    ctx.fillRect(
        x-8*scale,
        y,
        16*scale,
        125*scale
    );


    ctx.fillStyle="#142b1d";

    ctx.fillRect(
        x-45*scale,
        y-60*scale,
        90*scale,
        55*scale
    );

    ctx.fillRect(
        x-32*scale,
        y-90*scale,
        64*scale,
        50*scale
    );

    ctx.fillRect(
        x-20*scale,
        y-115*scale,
        40*scale,
        40*scale
    );

}

        ctx.globalAlpha=
            p.life/p.maxLife;

        ctx.fillStyle=p.color;

        ctx.fillRect(
            Math.floor(
                p.x-camera.x
            ),
            Math.floor(p.y),
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   PASSOS DA MATA
===================================================== */

function drawForestSteps(){

    if(!player.forestSteps)
        return;


    const start=
        Math.floor(
            camera.x/70
        )*70;


    for(
        let x=start;
        x<
        camera.x+WIDTH+100;
        x+=70
    ){

        if(
            Math.floor(x/70)%5!==0
        ){

            continue;

        }


        const screenX=
            x-camera.x;


        const y=
            458+
            Math.sin(x*.05)*3;


        ctx.globalAlpha=.65;

        ctx.fillStyle="#9ac77b";

        ctx.fillRect(
            screenX,
            y,
            7,
            11
        );

        ctx.fillRect(
            screenX+9,
            y-5,
            5,
            7
        );

    }


    ctx.globalAlpha=1;

}


/* =====================================================
   VITÓRIA
===================================================== */

function showBossVictory(){

    menu.innerHTML=`

        <div class="panel">

            <div class="title">
                GUARDIÃO DERROTADO
            </div>

            <div class="subtitle">

                O Curupira permanece
                em silêncio.

                <br><br>

                "Você procura o fogo..."

                <br><br>

                A lanterna de Caio
                começa a brilhar.

                <br><br>

                <strong>
                HABILIDADE DESBLOQUEADA:
                PASSOS DA MATA
                </strong>

                <br><br>

                Agora pegadas e caminhos
                ocultos podem ser revelados.

            </div>

            <button
                id="continueButton"
                type="button">

                CONTINUAR

            </button>

        </div>
    `;


    menu.classList.remove("hidden");


    document
        .getElementById("continueButton")
        .onclick=function(){

            player.forestSteps=true;

            currentStage++;


            if(currentStage>=5){

                finishWorld();

                return;

            }


            menu.classList.add("hidden");

            buildStage();

            showMessage(
                "PASSOS DA MATA desbloqueado!"
            );

        };

}


/* =====================================================
   PRÓXIMA FASE
===================================================== */

function nextStage(){

    currentStage++;


    if(currentStage>=5){

        finishWorld();

        return;

    }


    menu.innerHTML=`

        <div class="panel">

            <div class="title">
                ${stages[currentStage].name}
            </div>

            <div class="subtitle">

                A floresta fica mais profunda.

                <br><br>

                Novos caminhos surgem
                entre as árvores.

                <br><br>

                Os perigos também
                estão ficando maiores.

            </div>

            <button
                id="enterStage"
                type="button">

                ENTRAR NA FASE

            </button>

        </div>
    `;


    menu.classList.remove("hidden");


    document
        .getElementById("enterStage")
        .onclick=function(){

            menu.classList.add("hidden");

            buildStage();

            showMessage(
                stages[currentStage].name
            );

        };

}


/* =====================================================
   FIM DO MUNDO
===================================================== */

function finishWorld(){

    menu.innerHTML=`

        <div class="panel">

            <div class="title">
                FLORESTA CONCLUÍDA
            </div>

            <div class="subtitle">

                Caio atravessou
                a Floresta Perdida.

                <br><br>

                Mas o Curupira estava
                protegendo algo muito maior.

                <br><br>

                A chama antiga
                ainda existe.

                <br><br>

                <strong>
                PRÓXIMO DESTINO:
                VILA DO SACI
                </strong>

            </div>

            <button
                id="restartButton"
                type="button">

                JOGAR NOVAMENTE

            </button>

        </div>
    `;


    menu.classList.remove("hidden");


    document
        .getElementById("restartButton")
        .onclick=function(){

            location.reload();

        };

}


/* =====================================================
   SAÍDA DA FASE
===================================================== */

function checkStageExit(){

    if(
        currentStage<4 &&
        player.x>
        worldWidth-140
    ){

        nextStage();

    }

}


/* =====================================================
   INICIAR JOGO
===================================================== */

let gameStarted=false;


function startGame(){

    if(gameStarted)
        return;


    gameStarted=true;


    console.log(
        "O ÚLTIMO FOGO — iniciando..."
    );


    /* ÁUDIO NÃO PODE IMPEDIR O JOGO */

    try{

        startAudio();

    }catch(error){

        console.log(
            "Áudio ignorado."
        );

    }


    try{

        currentStage=0;

        player.coins=0;

        player.forestSteps=false;

        player.dead=false;

        player.x=120;

        player.y=350;

        player.vx=0;

        player.vy=0;

        player.health=
            player.maxHealth;

        player.checkpointX=120;

        player.checkpointY=350;


        buildStage();


        menu.classList.add(
            "hidden"
        );


        showMessage(
            "Minha avó dizia que a floresta era viva..."
        );


        console.log(
            "JOGO INICIADO!"
        );

    }
    catch(error){

        gameStarted=false;

        console.error(error);

        alert(
            "Erro ao iniciar o jogo:\n\n"+
            error.message
        );

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(
        menu.classList.contains("hidden")
    ){

        updatePlayer();

        updateEnemies();

        updateCollectibles();

        updateCheckpoint();

        updateBoss();

        updateProjectiles();

        updateParticles();

        updateCamera();

        checkStageExit();

        updateHUD();

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.save();


    if(camera.shake>0){

        ctx.translate(

            (Math.random()-.5)*
            camera.shake,

            (Math.random()-.5)*
            camera.shake

        );

    }


    drawBackground();

    drawPlatforms();

    drawCollectibles();

    drawProjectiles();

    drawEnemies();

    drawBoss();

    drawForestSteps();

    drawPlayer();

    drawParticles();


    ctx.restore();

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   CARREGAR
===================================================== */

buildStage();

updateHUD();

gameLoop();


console.log(
    "O Último Fogo carregado corretamente."
);

</script>
